<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>چاپ رضا</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
      font-family: sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1a1a1a, #000);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    .container {
      width: 100%;
      max-width: 360px;
      text-align: center;
      padding: 24px;
    }

    .logo {
      width: 120px;
      height: 120px;
      margin: 0 auto 16px;
      border-radius: 50%;
      overflow: hidden;
      box-shadow: 0 0 25px rgba(212,175,55,0.35);
    }

    .logo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 22px;
      margin: 12px 0 24px;
      letter-spacing: 1px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      color: #fff;
      background: linear-gradient(145deg, #1c1c1c, #0d0d0d);
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      transition: all 0.25s ease;
      font-size: 15px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(0,0,0,0.9);
    }

    .btn img {
      width: 30px;
      height: 30px;
      object-fit: left;
    }

    .footer {
      margin-top: 28px;
      font-size: 12px;
      opacity: 0.4;
    }
  </style>
</head>
<body>

  <div class="container">

    <div class="logo">
      <img src="logo.png" alt="chap">
    </div>

    <h1>چاپ رضا</h1>

    <!-- روبیکا -->
    <a class="btn" href="https://rubika.ir/Hadibakhoda">
      <img src="roobik.png">
      روبیکا
    </a>

    <!-- ایتا -->
    <a class="btn" href="https://eitaa.com/chap1reza">
      <img src="eitaa.png">
      ایتا
    </a>

    <!-- تماس ثابت -->
    <a class="btn" href="tel:05146123772">
      <img src="phon.png">
       تماس با ما
    </a>

    <!-- نشان (بعداً لینک رو عوض کن) -->
    <a class="btn" href="https://nshn.ir/fb7bffwW5JSob3">
      <img src="neshan.png">
      نشان
    </a>
    
    <!-- تماس ثابت -->
    <a class="btn" href="https://www.instagram.com/rezaprint1370?igsh=amF5ZXk3cjYxdmVj">
      <img src="instagram.png">
      اینستاگرام
    </a>

    <div class="footer">
     چناران ، بین طالقانی 2 و 4 
    </div>

  </div>

</body>
</html>
